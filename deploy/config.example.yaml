# Панель слушает ТОЛЬКО адрес внутри туннеля. Указывать 0.0.0.0 запрещено —
# запуск с таким значением завершится ошибкой.
listen: "10.0.0.1:8081"

auth:
  user: "admin"
  # Получить: awg3panel hash-password
  bcrypt: "ЗАМЕНИТЬ"

# Список управляемых интерфейсов AWG — один процесс обслуживает их все сразу:
# в вебе это переключатель вкладок, в CLI — флаг --iface (без него берётся
# первый по списку). Старый одноинтерфейсный формат (секции awg:/client:/
# storage: прямо здесь, без interfaces:) панель по-прежнему читает и сама
# сворачивает в список из одного элемента — переписывать уже работающий
# config.yaml ради перехода не обязательно. Оба вида на диске одновременно —
# ошибка старта, а не приоритет одного над другим: если в файле есть и то, и
# другое, непонятно, какая форма действует.
#
# Каждый интерфейс самодостаточен: свой конфиг AWG, свой bin_dir (у второго
# интерфейса ниже он отдельный сознательно — версии awg/awg-quick у двух
# интерфейсов вправе разойтись), свой endpoint и своё хранилище. Общий путь
# между двумя интерфейсами — ошибка валидации при старте: согласование
# состояния одного вычистило бы пиров другого.
#
# client: ниже — это СИД умолчаний, а не текущее значение. Он переносится в
# defaults.json при первом запуске интерфейса и дальше не перечитывается:
# правкой умолчаний из панели занимается defaults.json (лежит в /var/lib
# рядом с peers.json), а этот файл — то, что кладёт install.sh и с чем
# работает root, а не сервис. Править умолчания после первого запуска нужно
# через вкладку «Умолчания» в вебе.
#
# Правки серверного [Interface] (обфускация, порт, MTU) эта версия панели не
# умеет совсем — ни для одного интерфейса, поле interface_edit в этом
# примере поэтому не упоминается: сейчас оно ни на что не влияет.
interfaces:
  - id: awg3                        # slug для URL и каталога хранилища: [a-z0-9-], уникален
    title: "awg3 (боевой)"          # подпись вкладки в вебе
    interface: awg3                 # имя устройства для awg show/syncconf
    config: /etc/amnezia/amneziawg/awg3.conf
    bin_dir: /opt/awg3/bin
    client:
      endpoint: "203.0.113.10:51820"
      allowed_ips: "0.0.0.0/0"
      persistent_keepalive: "22-30"
      # Пусто сознательно: свой DNS конфликтует с AdGuard Home в домашней сети.
      dns: ""
      jc: 0
    storage:
      state: /var/lib/awg3panel/awg3/peers.json
      backups: /var/lib/awg3panel/awg3/backups
      keys: /var/lib/awg3panel/awg3/keys
      # Легаси-поле. Нужно только на переходе со старой одноинтерфейсной
      # установки: там выданные .conf лежали в общем каталоге clients/, и
      # приватный ключ существовал только внутри такого файла. Начиная с этой
      # версии панель хранит ключ отдельно (keys/<id>.key) и собирает .conf
      # заново при каждой выдаче; при первом обращении к пиру она сама
      # переносит его ключ из clients/<slug>.conf сюда и удаляет исходный
      # файл. Когда clients/ опустеет — поле можно убрать: панель в него
      # никогда не пишет, только читает на время миграции.
      client_configs: /var/lib/awg3panel/clients

  # Второй интерфейс — пример того, как выглядит независимый набор путей:
  # ничего не разделяет с awg3 выше, вплоть до отдельного bin_dir.
  - id: awg31                       # id — не interface: в id недопустима точка, это slug для URL
    title: "awg3.1"
    interface: awg3.1               # а вот реальное имя устройства — с точкой, как у AmneziaWG
    config: /etc/amnezia/amneziawg/awg3.1.conf
    bin_dir: /opt/awg3.1/bin
    client:
      endpoint: "203.0.113.10:51773"
      allowed_ips: "0.0.0.0/0"
      persistent_keepalive: "22-30"
      dns: ""
      jc: 0
    storage:
      state: /var/lib/awg3panel/awg31/peers.json
      backups: /var/lib/awg3panel/awg31/backups
      keys: /var/lib/awg3panel/awg31/keys
      # У свежего интерфейса легаси-каталога нет и не будет: старая
      # однофайловая панель им никогда не управляла, переносить ключи
      # неоткуда — поле client_configs просто не задано.
